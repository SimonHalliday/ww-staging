# Equipment categories. Each one needs a matching stub page in equipment/
# (copy an existing one, change the `category:` line) so Jekyll builds a URL for it.
#
# slug     must match the `category:` field on items in _equipment/
# name     heading shown on the card and the category page
# summary  one or two sentences, shown on the equipment index
# points   short capability bullets, shown on the index card

- slug: wireless-video
  name: Wireless Video Links
  summary: >-
    COFDM and SDI transmission from single-camera setups to full multi-camera
    rigs, in HD and 4K.
  points:
    - Short-range on-body and camera-mount transmitters
    - Long-range and diversity receive systems
    - Licensed and licence-exempt band operation

- slug: ip-mesh-data
  name: IP Mesh & Data
  summary: >-
    Mesh data networks carrying camera control alongside the video path, so the
    operator keeps full command of the camera.
  points:
    - Focus, iris and run/stop control
    - Remote head control
    - Telemetry and return video

- slug: antennas-rf
  name: Antennas & RF Distribution
  summary: >-
    The unglamorous half of a reliable link. Antenna selection, placement and
    distribution planned around the location, not guessed at.
  points:
    - Directional and omnidirectional arrays
    - Splitters, combiners and filtering
    - Tracking systems for moving subjects

- slug: aerial-long-range
  name: Aerial & Long Range
  summary: >-
    Helicopter-mounted transmitter installations, drone downlinks and ground
    receive sites for long-distance work.
  points:
    - Airborne transmitter installation
    - Ground receive stations and tracking
    - Link budget planning over distance

- slug: monitoring-control
  name: Monitoring & Control
  summary: >-
    Bespoke monitoring gives continuous visibility of every link, so problems are
    found and fixed before they reach the shoot.
  points:
    - Real-time link and signal monitoring
    - Rack control and remote management
    - Logging for post-shoot review

- slug: custom-built
  name: Custom-Built Systems
  summary: >-
    When nothing off the shelf fits, we design and build it — electronics,
    firmware and enclosures, in-house.
  points:
    - Bespoke RF and control hardware
    - Rack systems built for the job
    - Location-ready, road-proof builds
