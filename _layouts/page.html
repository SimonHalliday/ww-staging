---
layout: default
---
<div class="section">
  <div class="section-header">
    {%- if page.eyebrow %}<div class="section-eyebrow">{{ page.eyebrow }}</div>{% endif %}
    <h1 class="section-title">{{ page.heading | default: page.title }}</h1>
    {%- if page.intro %}<p class="section-desc">{{ page.intro }}</p>{% endif %}
  </div>
  {{ content }}
</div>
